<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FitCasa</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#14231f;--mu:#5b6f69;--pr:#0f766e;--on:#fff;--bd:#d9e4e0}
body.dark{--bg:#0e1816;--card:#16231f;--tx:#e8f2ef;--mu:#93aaa3;--bd:#27403a;--pr:#2dd4bf;--on:#04201c}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
header{background:var(--pr);color:var(--on);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));font-weight:800;font-size:21px;letter-spacing:.2px}
main{padding:12px;max-width:640px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:17px}
p{margin:6px 0}
.b{display:block;width:100%;background:var(--pr);color:var(--on);border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700}
.b.s{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{text-align:center}.st b{display:block;font-size:26px;color:var(--pr)}.st span{font-size:12px;color:var(--mu)}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;font-size:11px}
nav button.on{color:var(--pr);font-weight:700}
nav i{display:block;font-size:21px;font-style:normal}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chips button{flex:1;padding:10px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
.chips .on{background:var(--pr);color:var(--on);border-color:var(--pr);font-weight:700}
details{border-top:1px solid var(--bd);padding:9px 0}details:first-child{border-top:0}
summary{font-weight:600}
.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:1px 8px;color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pr)}
.days{display:flex;gap:6px;align-items:flex-end}
.days div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.days i{display:block;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px}
.note{color:var(--mu);font-size:13px}
#pl{display:none;position:fixed;inset:0;background:var(--bg);z-index:9;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
#pl .b{max-width:320px}
#pl2{display:none;position:fixed;inset:0;background:var(--bg);z-index:30;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}#pl2 .b{max-width:200px}
.fg{display:block;width:100%;max-width:260px;max-height:170px;margin:6px auto}
.big{font-size:72px;font-weight:800;color:var(--pr);line-height:1}
</style></head>
<body>
<header>🏠 FitCasa</header>
<main id="app"></main>
<nav></nav>
<div id="pl"></div>
<div id="pl2"></div>
<script src="figs.js"></script>
<script>
const $=s=>document.querySelector(s),K='fitcasa_ejercicios_v1';
const key=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=k=>k.split('-').reverse().join('/'),today=()=>key();
const parse=s=>{const m=s.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(!m)return null;const d=new Date(+m[3],+m[2]-1,+m[1]);return d.getMonth()==+m[2]-1?key(d):null};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S,T='i',V=1,W=0,P=null;
function load(){let o=null;try{o=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!o){try{o=JSON.parse(localStorage.getItem('fitcasa_v1'));if(o){localStorage.setItem(K,JSON.stringify(o));localStorage.removeItem('fitcasa_v1')}}catch(e){}}S=Object.assign({name:'',w:0,h:0,lvl:1,dark:0,sessions:[],weights:[],water:{},wu:1,st:1,days:[1,3,5],rt:'',wi:0,pin:'',waist:[],wd:[]},o||{})}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}

// [nombre, nivel, material, pasos, versión más fácil]
const EX=[
['Rotación de torso sentado',1,'Silla','Sentado y erguido, manos en el pecho. Gira el torso a un lado y al otro sin mover las caderas.','Gira menos y más lento.'],
['Elevación de rodillas sentado',1,'Silla','Sentado al borde de la silla, sujeta los lados. Sube una rodilla hacia el pecho y alterna.','Sube solo un poco la rodilla.'],
['Extensión de piernas sentado',1,'Silla','Estira una pierna al frente y aprieta el muslo 1 s. Baja y alterna.','Sin pausa arriba.'],
['Toque cruzado sentado',1,'Silla','Manos tras la nuca. Lleva el codo hacia la rodilla contraria y alterna, apretando el abdomen.','Toca solo con la mano.'],
['Marcha en el lugar',1,'Ninguno','De pie junto a una pared o silla, sube las rodillas alternando a ritmo cómodo. Sin saltar.','Hazlo sentado.'],
['Lagartijas en la pared',1,'Pared','Manos en la pared a la altura del pecho, pies atrás. Flexiona los codos acercando el pecho y empuja.','Acércate más a la pared.'],
['Sentada a la silla',1,'Silla','Párate frente a la silla, siéntate despacio y levántate sin impulso. Usa las manos si hace falta.','Usa las manos para ayudarte.'],
['Payasitos sin salto',2,'Ninguno','Abre un pie al costado mientras subes los brazos; vuelve y alterna. Sin saltar: bajo impacto.','Sube solo un brazo.'],
['Sentadillas',2,'Ninguno o silla','Pies al ancho de hombros. Lleva las caderas atrás como para sentarte, rodillas hacia los dedos, y sube.','Toca la silla en cada bajada.'],
['Lagartijas inclinadas',2,'Mesa o silla firme','Manos en el borde de una mesa o silla firme, cuerpo recto. Baja el pecho y empuja.','Usa una superficie más alta.'],
['Caminata rápida de 10 m',2,'Espacio de 10 m','Camina rápido 10 m, da la vuelta y regresa. Brazos activos, pisada suave.','Camina a ritmo normal.'],
['Curl con botellas',2,'2 botellas con agua','Una botella en cada mano, codos pegados al cuerpo. Sube las botellas y baja controlado.','Usa botellas más livianas.'],
['Plancha sobre mesa',2,'Mesa o silla firme','Antebrazos en la mesa, cuerpo en línea recta, abdomen apretado. Respira normal.','Aguanta menos tiempo.'],
['Sentadilla con mochila',3,'Mochila con libros','Sostén la mochila contra el pecho y haz sentadillas profundas y controladas.','Sentadilla sin peso.'],
['Lagartijas en el piso',3,'Piso o colchoneta','Manos bajo los hombros, cuerpo recto. Baja el pecho al piso y sube.','Apoya las rodillas.'],
['Payasitos completos',3,'Ninguno','Salta abriendo piernas y brazos y vuelve. Impacto medio: opcional.','Haz los payasitos sin salto.'],
['Piques de 10 m',3,'Espacio de 10 m','Corre fuerte 10 m, frena y regresa caminando. Impacto alto: calienta antes y usa calzado.','Trota suave o camina rápido.'],
['Zancadas hacia atrás',3,'Ninguno','Da un paso atrás y baja la rodilla casi al piso; sube y alterna.','Apóyate en una silla.'],
['Extensión de pierna reclinado',1,'Piso o colchoneta','Siéntate con las rodillas dobladas y las manos atrás. Estira una pierna hasta apoyar el talón en el piso, vuelve y alterna.','Apoya también los codos.'],
['Plancha inclinada con toque de pies',1,'Silla firme','Manos en el asiento de una silla firme (apoyada en la pared), cuerpo recto. Lleva un pie atrás, toca el piso y alterna.','Hazlo más lento y con pasos cortos.'],
['Encogimiento sentado',2,'Piso o colchoneta','Recostado hacia atrás sobre las manos, rodillas dobladas. Lleva pecho y rodillas al centro a la vez y vuelve despacio.','Apoya los codos y mueve menos.'],
['Zancada desde la silla',2,'Silla firme','Manos en la silla, un pie al frente con la rodilla doblada y el otro atrás. Sube a una zancada erguida, baja y alterna.','Deja las manos apoyadas todo el tiempo.'],
['Escaladores inclinados',3,'Silla firme','Manos en la silla firme, cuerpo recto. Lleva una rodilla al pecho y cambia de pierna a ritmo constante, sin saltar.','Hazlo lento: una pierna cada 2 s.'],
['Elevación de pierna reclinado',3,'Piso o colchoneta','Recostado sobre las manos, sube una pierna estirada y baja la otra casi al piso; alterna con control. Cuida la zona lumbar.','Dobla un poco la rodilla que sube.'],
['Círculos de brazos',0,'Ninguno','De pie, brazos extendidos a los lados. Haz círculos amplios hacia adelante y luego hacia atrás.','Hazlos más pequeños.'],
['Estiramiento de cuádriceps',0,'Silla (apoyo)','De pie, sujétate de una silla. Lleva un talón hacia el glúteo y sostén; cambia de pierna a mitad de tiempo.','No lleves el talón tan alto.'],
['Inclinación al frente',0,'Ninguno','De pie, baja el torso con las rodillas flojas y los brazos colgando. Respira profundo y sube despacio.','Dobla más las rodillas.'],
['Estiramiento de brazos',0,'Ninguno','Estira un brazo al frente y llévalo al pecho con la otra mano; sostén y cambia de lado.','Estira con menos fuerza.'],
['Sentadilla sumo con giro',2,'Ninguno','Piernas bien abiertas y rodillas dobladas. Baja apoyando una mano en la rodilla, gira el torso abriendo el otro brazo hacia arriba y cambia de lado.','Baja menos y gira más despacio.'],
['Gato-vaca a cuatro apoyos',1,'Piso o colchoneta','Apoya manos y rodillas. Sube la cadera redondeando la espalda y vuelve a bajar con calma, llevando el abdomen hacia adentro.','Haz el movimiento más corto.'],
['Giro de torso sentado',1,'Piso o colchoneta','Sentado con las piernas cruzadas y los brazos abiertos. Gira el torso a un lado y al otro, con la espalda recta.','Gira menos y mantén las manos en las rodillas.'],
['Rodilla al pecho a cuatro apoyos',1,'Piso o colchoneta','Manos en el piso y una rodilla apoyada. Lleva la otra rodilla hacia el pecho, vuelve a estirar la pierna hacia atrás y alterna.','Apoya las dos rodillas y mueve una pierna cada vez.'],
['Rodilla al codo (araña)',2,'Piso o colchoneta','En plancha sobre las manos, lleva una rodilla hacia el codo del mismo lado, vuelve y alterna con control.','Haz una repetición cada 3 segundos.'],
['Plancha a perro boca abajo',3,'Piso o colchoneta','En plancha sobre las manos, sube la cadera formando una V invertida, empuja el piso con las manos y vuelve a la plancha.','Hazlo con las rodillas apoyadas.'],
['Bicicleta reclinada',2,'Piso o colchoneta','Sentado, inclinado hacia atrás y apoyado en las manos. Alterna una rodilla al pecho mientras la otra pierna se estira.','Apoya los antebrazos en el piso.'],
['Abdominal clásico',1,'Piso o colchoneta','Acostado con las rodillas dobladas y las manos suaves detrás de la cabeza. Sube el pecho con el abdomen, sin tirar del cuello, y baja despacio.','Sube menos y apoya los pies contra algo.'],
['Rodillas alternas acostado',1,'Piso o colchoneta','Acostado boca arriba, lleva una rodilla al pecho mientras la otra pierna se estira cerca del piso. Alterna con ritmo suave.','Apoya la pierna estirada en el piso.'],
['Abdominal inverso',2,'Piso o colchoneta','Acostado, con las rodillas dobladas sobre el pecho. Sube la cadera unos centímetros con el abdomen, sin impulso, y baja controlado.','Sube solo un poco la cadera.'],
['Plancha baja con rodilla',2,'Piso o colchoneta','En plancha sobre los antebrazos con el cuerpo recto. Lleva una rodilla hacia adelante, vuelve y alterna sin subir la cadera.','Apoya las rodillas en el piso.'],
['Elevación en L con rodillas',3,'Piso o colchoneta','Sentado con las manos en el piso junto a las caderas. Despega la cadera, estira las piernas y lleva una rodilla al pecho; alterna. Exige fuerza de abdomen y brazos.','Mantén los pies en el piso y levanta solo una rodilla.']
];
const R={1:[[0,1,2,3,4,5,6],[4,18,19,6,5,2,3],[4,29,30,35,36,31,0]],2:[[4,7,8,9,10,11,12,3],[7,20,21,8,9,12,10,19],[28,29,32,34,37,38,35,30]],3:[[4,15,13,14,17,16,12,11],[22,23,20,21,14,17,13,12],[28,33,32,38,39,37,34,35]]};
const L={1:{n:'Novato',w:30,r:30,s:2},2:{n:'Intermedio',w:40,r:20,s:3},3:{n:'Pro',w:45,r:15,s:3}};
const TIPS=['Calienta 2 minutos antes de empezar: marcha suave y giros de hombros.','La constancia vale más que la intensidad: 3 días por semana ya suman.','Respira de forma continua; no aguantes el aire en el esfuerzo.','Toma agua antes, durante y después de la rutina.','Duerme 7 a 8 horas: ahí tu cuerpo se recupera.','Si algo duele (no el cansancio normal), detente y consulta.'];

const nv=l=>S.sessions.filter(x=>x.l==l).length%3;
const core=(l,v)=>{const c=L[l],a=[];R[l][v].forEach(i=>{for(let s=1;s<=c.s;s++){a.push({t:'w',i,s,d:c.w});a.push({t:'r',i,s,d:c.r})}});a.pop();return a};
const WU=[24,4],ST=[25,26,27],ex=(a,x)=>a.map(i=>({t:'w',i,s:1,d:30,x}));
const steps=(l,v=0)=>[...(S.wu?ex(WU,'Calentamiento'):[]),...core(l,v),...(S.st?ex(ST,'Estiramiento'):[])];
const mins=(l,v=0)=>Math.round(steps(l,v).reduce((a,x)=>a+x.d,0)/60);
const wTot=()=>(S.water[today()]||[]).reduce((a,b)=>a+b,0);
const sesToday=()=>S.sessions.filter(x=>x.d==today()).length;
const goal=()=>Math.round((S.w?S.w*35:2000)/50)*50+sesToday()*350;
const imc=()=>S.w&&S.h?S.w/((S.h/100)**2):0;
const cat=v=>v<18.5?'Bajo peso':v<25?'Peso normal':v<30?'Sobrepeso':'Obesidad';
function streak(){const ds=new Set(S.sessions.map(x=>x.d));let n=0,d=new Date();if(!ds.has(key(d)))d.setDate(d.getDate()-1);while(ds.has(key(d))){n++;d.setDate(d.getDate()-1)}return n}

const tabs=[['i','🏠','Inicio'],['r','🏋️','Rutinas'],['p','📈','Progreso'],['s','💧','Salud'],['a','⚙️','Ajustes']];
function render(){
 $('#app').innerHTML=({i:vI,r:vR,p:vP,s:vS,a:vA})[T]();
 $('nav').innerHTML=tabs.map(t=>`<button class="${T==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('');
 document.body.classList.toggle('dark',!!S.dark);
 document.querySelector('meta[name=theme-color]').content=S.dark?'#16231f':'#0f766e';typeof drawFigs=='function'&&drawFigs()}
function go(t){T=t;render();scrollTo(0,0)}

function vI(){
 const need=!S.w||!S.h,lv=S.sessions.filter(x=>x.l==S.lvl).length,g=goal(),w=wTot();
 if(need)return `<div class="c"><h2>¡Bienvenido a FitCasa! 👋</h2><p>Completa tus datos para empezar.</p><label>Nombre</label><input id="n" value="${esc(S.name)}"><label>Peso (kg)</label><input id="w" type="number" inputmode="decimal"><label>Altura (cm)</label><input id="h" type="number" inputmode="numeric"><label>Nivel</label><select id="l">${[1,2,3].map(i=>`<option value="${i}">${L[i].n}</option>`).join('')}</select><button class="b" onclick="setup()">Guardar y empezar</button></div>`;
 return `<div class="c"><h2>Hola${S.name?', '+esc(S.name):''} 👋</h2><p>Nivel <b>${L[S.lvl].n}</b> · racha de <b>${streak()}</b> día(s)</p><button class="b" onclick="play(${S.lvl},${nv(S.lvl)})">▶ Empezar rutina ${'ABC'[nv(S.lvl)]} (~${mins(S.lvl,nv(S.lvl))} min)</button></div>
 <div class="c"><h2>📅 Esta semana</h2><div class="g" style="grid-template-columns:repeat(7,1fr)">${wk()}</div><p class="note">${S.days.includes(new Date().getDay())?'Hoy toca entrenar 💪':'Hoy es día de descanso (o entrena si quieres)'} · 🟡 plan, ✅ hecho</p></div>
 <div class="c"><h2>💧 Agua de hoy</h2><div class="bar"><i style="width:${Math.min(100,w/g*100)}%"></i></div><p>${w} de ${g} ml</p><button class="b s" onclick="addW(250)">+ Vaso (250 ml)</button></div>
 <div class="c"><h2>🎯 Subir de nivel</h2><div class="bar"><i style="width:${Math.min(100,lv*10)}%"></i></div><p>${lv}/10 sesiones en ${L[S.lvl].n}${lv>=10&&S.lvl<3?'. ¡Ya puedes pasar al siguiente nivel en Ajustes!':''}</p></div>
 <div class="c"><h2>💡 Consejo del día</h2><p>${TIPS[new Date().getDate()%TIPS.length]}</p></div>`}
function setup(){const w=+$('#w').value,h=+$('#h').value;if(!(w>20&&w<400&&h>100&&h<250))return alert('Revisa tu peso (kg) y altura (cm).');S.name=$('#n').value.trim();S.w=w;S.h=h;S.lvl=+$('#l').value;V=S.lvl;S.weights.push({d:today(),w});save();render()}

function vR(){
 const l=V,r=R[l][W];
 return `<div class="chips">${[1,2,3].map(i=>`<button class="${V==i?'on':''}" onclick="V=${i};render()">${L[i].n}</button>`).join('')}</div>
 <div class="chips">${['A','B','C'].map((x,j)=>`<button class="${W==j?'on':''}" onclick="W=${j};render()">Rutina ${x}</button>`).join('')}</div>
 <div class="c"><h2>${L[l].n}: ${r.length} ejercicios</h2><p>${L[l].s} series de ${L[l].w} s, descanso de ${L[l].r} s · ~${mins(l,W)} min</p><button class="b" onclick="play(${l},${W})">▶ Empezar rutina</button></div>
 <div class="c">${r.map(i=>{const e=EX[i];return `<details><summary>${e[0]}</summary><p><span class="tag">${e[2]}</span></p><svg data-f="${i}" viewBox="0 0 200 140" class="fg"></svg><p>${e[3]}</p><p><b>Más fácil:</b> ${e[4]}</p></details>`}).join('')}</div>
 <p class="note">Si sientes dolor, mareo o falta de aire, detente. Consulta a tu médico antes de empezar.</p>`}

function vP(){
 const days=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);const kk=key(d);return['DLMMJVS'[d.getDay()],S.sessions.filter(x=>x.d==kk).reduce((a,x)=>a+x.m,0)]});
 const mx=Math.max(10,...days.map(x=>x[1])),wk=days.reduce((a,x)=>a+x[1],0);
 const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);
 return `<div class="c"><div class="g"><div class="st"><b>${S.sessions.length}</b><span>sesiones</span></div><div class="st"><b>${streak()}</b><span>racha (días)</span></div><div class="st"><b>${wk}</b><span>min. semana</span></div></div><p class="note" style="text-align:center;margin-top:10px">🔥 ~${S.sessions.reduce((a,x)=>a+(x.k||0),0)} kcal estimadas en total</p></div>
 <div class="c"><h2>🏅 Medallas</h2><div class="g">${badges().map(b=>`<div class="st" style="${b[2]?'':'opacity:.3;filter:grayscale(1)'}"><div style="font-size:30px">${b[0]}</div><span>${b[1]}</span></div>`).join('')}</div></div>
 <div class="c"><h2>Últimos 7 días (min)</h2><div class="days">${days.map(x=>`<div><i style="height:${x[1]/mx*60}px"></i>${x[0]}</div>`).join('')}</div></div>
 <div class="c"><h2>⚖️ Mi peso</h2>${spark(ws)}<label>Peso (kg)</label><input id="pw" type="number" inputmode="decimal"><label>Fecha (dd/mm/aaaa)</label><input id="pd" type="text" inputmode="numeric" value="${fmt(today())}"><button class="b" onclick="addWeight()">Guardar peso</button>${ws.slice(-5).reverse().map(x=>`<p>${fmt(x.d)}: <b>${x.w} kg</b></p>`).join('')}</div>
 <div class="c"><h2>📏 Cintura</h2>${spark(swd(S.waist),'cm')}<label>Cintura (cm)</label><input id="cw" type="number" inputmode="decimal"><label>Fecha (dd/mm/aaaa)</label><input id="cd" type="text" inputmode="numeric" value="${fmt(today())}"><button class="b" onclick="addWaist()">Guardar cintura</button>${swd(S.waist).slice(-5).reverse().map(x=>`<p>${fmt(x.d)}: <b>${x.w} cm</b></p>`).join('')}</div>
 <div class="c"><h2>📸 Fotos de progreso</h2><input type="file" id="ph" accept="image/*" hidden onchange="addPhoto(this.files[0])"><button class="b s" onclick="$('#ph').click()">+ Agregar foto</button><div class="g" style="margin-top:10px">${PH.map(p=>`<div class="st" onclick="delPhoto(${p.id})"><img src="${p.u}" style="width:100%;border-radius:8px"><span>${fmt(p.d)}</span></div>`).join('')}</div><p class="note">Toca una foto para borrarla. Se guardan solo en este teléfono y no entran en la copia de seguridad.</p></div>`}
function spark(a,u='kg'){if(a.length<2)return '<p class="note">Registra al menos 2 pesos para ver el gráfico.</p>';const v=a.map(x=>x.w),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;const p=v.map((y,i)=>(i/(v.length-1)*300).toFixed(1)+','+(50-(y-mn)/r*45).toFixed(1)).join(' ');return `<svg viewBox="0 0 300 55" width="100%"><polyline points="${p}" fill="none" stroke="var(--pr)" stroke-width="3" stroke-linejoin="round"/></svg><p class="note">De ${mn} a ${mx} ${u}</p>`}
function addWeight(){const w=+$('#pw').value,d=parse($('#pd').value);if(!(w>20&&w<400))return alert('Ingresa un peso válido en kg.');if(!d)return alert('Escribe la fecha como dd/mm/aaaa.');S.weights=S.weights.filter(x=>x.d!=d);S.weights.push({d,w});S.w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1).pop().w;save();render()}

function imBox(){const v=imc();if(!v)return '<p>Ingresa peso y altura.</p>';return `<p style="font-size:28px;margin:4px 0"><b>${v.toFixed(1)}</b> · ${cat(v)}</p><div class="bar"><i style="width:${Math.max(0,Math.min(100,(v-15)/25*100))}%"></i></div><p class="note">Referencia OMS: 18,5 a 24,9 es normal. El IMC es solo orientativo.</p>`}
function im(){$('#im').innerHTML=imBox()}
function vS(){
 const g=goal(),w=wTot();
 return `<div class="c"><h2>Calculadora de IMC</h2><label>Peso (kg)</label><input type="number" inputmode="decimal" value="${S.w||''}" oninput="S.w=+this.value;save();im()"><label>Altura (cm)</label><input type="number" inputmode="numeric" value="${S.h||''}" oninput="S.h=+this.value;save();im()"><div id="im">${imBox()}</div></div>
 <div class="c"><h2>📏 Cintura / altura</h2>${whtr()}</div>
 <div class="c"><h2>💧 Agua diaria</h2><p>Meta: <b>${g} ml</b> (35 ml por kg + 350 ml por cada sesión de hoy)</p><div class="bar"><i style="width:${Math.min(100,w/g*100)}%"></i></div><p>${w} ml · ${Math.round(w/250*10)/10} vasos</p><div class="g"><button class="b s" onclick="addW(200)">+200</button><button class="b s" onclick="addW(250)">+250</button><button class="b s" onclick="addW(500)">+500</button></div><button class="b s" style="margin-top:8px" onclick="undoW()">↩ Deshacer último</button></div>`}
function addW(n){const a=S.water[today()]||[];a.push(n);S.water[today()]=a;if(wTot()>=goal()&&!S.wd.includes(today())){S.wd.push(today());toast('💧 ¡Meta de agua cumplida! 🎉')}save();render()}
function undoW(){(S.water[today()]||[]).pop();save();render()}

function vA(){return vInst()+`<div class="c"><h2>Perfil</h2><label>Nombre</label><input value="${esc(S.name)}" onchange="S.name=this.value;save()"><label>Nivel</label><select onchange="S.lvl=+this.value;V=S.lvl;save()">${[1,2,3].map(i=>`<option value="${i}" ${S.lvl==i?'selected':''}>${L[i].n}</option>`).join('')}</select><label>Modo oscuro</label><select onchange="S.dark=+this.value;save();render()"><option value="0">No</option><option value="1" ${S.dark?'selected':''}>Sí</option></select></div>
 <div class="c"><h2>📅 Plan y avisos</h2><label>Días de entrenamiento</label><div class="chips">${[1,2,3,4,5,6,0].map(d=>`<button class="${S.days.includes(d)?'on':''}" onclick="tgDay(${d})">${'DLMXJVS'[d]}</button>`).join('')}</div><label>Hora del recordatorio (hh:mm)</label><input type="text" inputmode="numeric" placeholder="18:30" value="${S.rt}" onchange="setRt(this.value)"><label>Aviso de agua cada (horas, 0 = no)</label><input type="number" inputmode="numeric" value="${S.wi}" onchange="S.wi=+this.value||0;save()"><button class="b s" onclick="window.Notification&&Notification.requestPermission()">🔔 Activar notificaciones</button><p class="note">Los avisos llegan mientras FitCasa esté abierta o en segundo plano. Para estar seguro, usa también la alarma del celular.</p></div>
 <div class="c"><h2>Sesión y seguridad</h2><label>Calentamiento antes de la rutina</label>${yn('wu')}<label>Estiramiento al final</label>${yn('st')}<button class="b s" onclick="setPin()">🔒 ${S.pin?'Cambiar':'Crear'} PIN</button>${S.pin?'<button class="b s" style="margin-top:8px" onclick="noPin()">Quitar PIN</button>':''}</div>
 <div class="c"><h2>Copia de seguridad</h2><button class="b s" onclick="exp()">⬇ Exportar datos</button><input type="file" id="f" accept=".json" hidden onchange="imp(this.files[0])"><button class="b s" style="margin-top:8px" onclick="$('#f').click()">⬆ Importar datos</button><button class="b s" style="margin-top:8px" onclick="if(confirm('¿Borrar todos los datos?')){localStorage.removeItem(K);load();render()}">🗑 Borrar todo</button></div>
 <p class="note">FitCasa v3 · Tus datos se guardan solo en este teléfono. No reemplaza la guía de un profesional de la salud.</p>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='fitcasa-backup-'+today()+'.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render();alert('Datos importados.')}catch(e){alert('El archivo no es válido.')}};r.readAsText(f)}

// Rutina guiada
function beep(f=880,ms=120){try{const c=beep.c||(beep.c=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+ms/1000)}catch(e){}}
function play(l,v=0){const a=steps(l,v);P={l,a,k:0,left:a[0].d,pause:0,el:0};$('#pl').style.display='flex';drawP();P.tm=setInterval(tick,1000);try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
function tick(){if(P.pause)return;P.el++;P.left--;if(P.left>0&&P.left<=3)beep();if(P.left<=0)next();else drawP()}
function next(){if(P.k>=P.a.length-1)return finish();P.k++;P.left=P.a[P.k].d;beep(1200,250);drawP()}
function drawP(){const s=P.a[P.k],e=EX[s.i],w=s.t=='w',n=P.a[P.k+1];
 $('#pl').innerHTML=`<p class="note">Paso ${P.k+1} de ${P.a.length}</p><h2 style="font-size:26px">${w?e[0]:'Descanso'}</h2>${w?`<svg data-f="${s.i}" viewBox="0 0 200 140" class="fg"></svg>`:''}<div class="big">${P.left}</div><p>${w?(s.x||`Serie ${s.s} de ${L[P.l].s}`):'Siguiente: '+EX[n.i][0]}</p><p style="max-width:420px">${w?e[3]:''}</p><button class="b" onclick="P.pause=!P.pause;drawP()">${P.pause?'▶ Continuar':'⏸ Pausar'}</button><button class="b s" onclick="next()">⏭ Saltar</button><button class="b s" onclick="quit()">✖ Salir</button>`;typeof drawFigs=='function'&&drawFigs()}
function end(){clearInterval(P.tm);$('#pl').style.display='none'}
function quit(){if(confirm('¿Salir de la rutina?')){end();P=null}}
function finish(){end();const m=Math.max(1,Math.round(P.el/60)),k=Math.round(MET[P.l]*(S.w||70)*m/60);S.sessions.push({d:today(),l:P.l,m,k});save();P=null;beep(1500,400);alert('🎉 ¡Sesión completada! ~'+k+' kcal (estimado). Toma agua.');T='p';render()}

const MET={1:2.8,2:3.8,3:5},swd=a=>[...a].sort((x,y)=>x.d<y.d?-1:1);
const yn=k=>`<select onchange="S.${k}=+this.value;save()"><option value="1" ${S[k]?'selected':''}>Sí</option><option value="0" ${S[k]?'':'selected'}>No</option></select>`;
let PH=[],LW=Date.now(),DP=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;if(T=='a')render()});
addEventListener('appinstalled',()=>{DP=null;toast('✅ App instalada');if(T=='a')render()});
const inst=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
async function instalar(){if(!DP)return;DP.prompt();await DP.userChoice;DP=null;render()}
function vInst(){return '<div class="c"><h2>📲 Instalar app</h2>'+(inst()?'<p>✅ FitCasa ya está instalada en este dispositivo.</p>':DP?'<p>Instálala para abrirla como una app, sin la barra del navegador y sin internet.</p><button class="b" onclick="instalar()">Instalar FitCasa</button>':/iphone|ipad|ipod/i.test(navigator.userAgent)?'<p>En iPhone: toca el botón Compartir y elige “Añadir a pantalla de inicio”.</p>':'<p>Si no aparece el botón, abre el menú ⋮ del navegador y elige “Instalar app” o “Añadir a pantalla de inicio”.</p>')+'</div>'}
function maxStreak(){const ds=[...new Set(S.sessions.map(x=>x.d))].sort();let b=0,c=0,p=null;ds.forEach(d=>{c=p&&new Date(d)-new Date(p)==864e5?c+1:1;b=Math.max(b,c);p=d});return b}
function badges(){const n=S.sessions.length,m=maxStreak();return[['🥇','Primera sesión',n>=1],['🔟','10 sesiones',n>=10],['🏆','25 sesiones',n>=25],['🔥','Racha de 3 días',m>=3],['⚡','Racha de 7 días',m>=7],['💧','Meta de agua',S.wd.length>0],['📏','Cintura medida',S.waist.length>0],['📸','Foto de progreso',PH.length>0],['⭐','Sesión Pro',S.sessions.some(x=>x.l==3)]]}
function wk(){const d0=new Date(),dw=(d0.getDay()+6)%7;return[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d0.getDate()-dw+k);const kk=key(d),g=d.getDay(),ok=S.sessions.some(x=>x.d==kk);return `<div style="text-align:center"><div class="tag" style="${kk==today()?'border-color:var(--pr);color:var(--pr)':''}">${'DLMXJVS'[g]}</div><div style="font-size:20px">${ok?'✅':S.days.includes(g)?'🟡':'·'}</div></div>`}).join('')}
function whtr(){const l=swd(S.waist).pop();if(!l||!S.h)return '<p>Registra tu cintura en Progreso.</p>';const r=l.w/S.h;return `<p style="font-size:28px;margin:4px 0"><b>${r.toFixed(2)}</b> · ${r<.5?'Saludable':r<.6?'Riesgo aumentado':'Riesgo alto'}</p><p class="note">Meta general: mantener la cintura por debajo de la mitad de tu estatura.</p>`}
function addWaist(){const w=+$('#cw').value,d=parse($('#cd').value);if(!(w>30&&w<250))return alert('Ingresa tu cintura en cm.');if(!d)return alert('Escribe la fecha como dd/mm/aaaa.');S.waist=S.waist.filter(x=>x.d!=d);S.waist.push({d,w});save();render()}
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('fitcasa_ejercicios',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no()});
async function phLoad(){try{const db=await idb();PH=await new Promise(ok=>{const q=db.transaction('ph').objectStore('ph').getAll();q.onsuccess=()=>ok(q.result.sort((a,b)=>a.id-b.id));q.onerror=()=>ok([])})}catch(e){PH=[]}if(T=='p')render()}
async function phPut(p,del){try{const st=(await idb()).transaction('ph','readwrite').objectStore('ph');del?st.delete(p):st.put(p)}catch(e){}}
function addPhoto(f){if(!f)return;const im=new Image();im.onload=async()=>{const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);PH.push({id:Date.now(),d:today(),u:c.toDataURL('image/jpeg',.7)});await phPut(PH[PH.length-1]);render()};im.src=URL.createObjectURL(f)}
function delPhoto(id){if(confirm('¿Borrar esta foto?')){PH=PH.filter(p=>p.id!=id);phPut(id,1);render()}}
async function hp(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('fc'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function lock(){if(!S.pin)return;const e=$('#pl2');e.style.display='flex';e.innerHTML='<h2>🔒 FitCasa</h2><p>Ingresa tu PIN</p><input id="pn" type="password" inputmode="numeric" maxlength="6" style="max-width:200px;text-align:center"><button class="b" onclick="unlock()">Entrar</button><p class="note">¿Lo olvidaste? Borra los datos del sitio en el navegador.</p>'}
async function unlock(){if(await hp($('#pn').value)==S.pin)$('#pl2').style.display='none';else{$('#pn').value='';alert('PIN incorrecto')}}
async function setPin(){const p=prompt('Nuevo PIN (4 a 6 números):');if(p===null)return;if(!/^\d{4,6}$/.test(p))return alert('El PIN debe tener de 4 a 6 números.');S.pin=await hp(p);save();render();alert('PIN guardado.')}
function noPin(){if(confirm('¿Quitar el PIN?')){S.pin='';save();render()}}
function tgDay(d){S.days=S.days.includes(d)?S.days.filter(x=>x!=d):[...S.days,d];save();render()}
function setRt(v){v=v.trim();const m=v.match(/^(\d{1,2}):(\d{2})$/);if(!v)S.rt='';else if(m&&+m[1]<24&&+m[2]<60)S.rt=m[1].padStart(2,'0')+':'+m[2];else alert('Escribe la hora como hh:mm, por ejemplo 18:30.');save();render()}
function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;top:12px;left:12px;right:12px;z-index:40;background:var(--pr);color:var(--on);padding:12px;border-radius:12px;font-weight:700;text-align:center';document.body.appendChild(e);setTimeout(()=>e.remove(),6000)}
function note(t){if(window.Notification&&Notification.permission=='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('FitCasa',{body:t,icon:'icon-192.png'}));else toast(t)}
setInterval(()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),k=today();
 if(S.rt&&S.rt==hm&&S.days.includes(n.getDay())&&S.nt!=k&&!sesToday()){S.nt=k;save();note('💪 Hora de tu rutina de hoy')}
 if(S.wi>0&&n.getHours()>=8&&n.getHours()<21&&Date.now()-LW>=S.wi*36e5&&wTot()<goal()){LW=Date.now();note('💧 Toma un vaso de agua')}},30000);
load();V=S.lvl;render();lock();phLoad();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
